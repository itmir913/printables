<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var root = document.documentElement;
            var theme = null;
            try {
                theme = localStorage.getItem('theme');
            } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            root.dataset.theme = theme;
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="교실에서 바로 인쇄해 쓰는 자료 모음입니다. 진학 지도 가이드북과 문제 은행 등 교사용 인쇄물을 웹으로 열고 Chrome으로 인쇄합니다.">
    <meta name="theme-color" content="#fcfcfa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <title>Printables | luminousky.com</title>
    <link rel="icon" href="https://luminousky.com/favicon.svg" type="image/svg+xml">

</head>
