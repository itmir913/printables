# GitHub Pages 배포.
#
# **손으로 실행할 때만 배포한다.** main에 push해도 사이트는 바뀌지 않는다. 원고를 고치는
# 커밋은 하루에도 여러 번 생기고, 그때마다 학생이 받은 링크의 내용이 바뀌면 안 된다.
# 배포: Actions → Deploy to GitHub Pages → Run workflow
#       (또는 gh workflow run "Deploy to GitHub Pages")
#
# 빌드 단계가 없다. 자료는 브라우저가 원고(원고/*.html, 문제은행/*.md)를 fetch로
# 조립하는 정적 파일이므로, 저장소를 그대로 올리되 작업용 파일만 걸러 낸다.
#
# 저장소 설정이 Settings → Pages → Source: GitHub Actions 여야 한다.
# 비공개 저장소는 Pro 이상 요금제에서만 Pages를 쓸 수 있다.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

# 배포가 겹치지 않게 한 번에 하나만 돌린다.
# 진행 중인 배포를 취소하지 않는다 — 중간에 끊으면 사이트가 반쯤 갱신된 채 남는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pages가 꺼져 있으면 켠다. 저장소 설정을 사람이 미리 바꿔 두지 않아도 돌아간다
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # 작업 지침(CLAUDE.md)과 점(.)으로 시작하는 설정 파일은 올리지 않는다.
      # 문제은행/*.md는 페이지가 읽는 원고이므로 .md 전체를 빼면 안 된다
      - name: Stage site
        run: |
          rsync -a \
            --exclude '.*' \
            --exclude 'CLAUDE.md' \
            --exclude '_site' \
            ./ _site/
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
