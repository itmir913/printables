<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>면접 지도 가이드북</title>

<!-- Tailwind = 면 안에서의 배치·간격.  style.css = 인쇄 규격과 부품.
     HTML 에 style="..." 속성을 쓰지 않는다. 치수는 아래 토큰이나
     임의값 유틸리티(min-h-[32mm], w-[34%])로 적는다.
     토큰은 tailwind.config.js 에, 묶는 순서는 tailwind.css 에 있다. -->
<link rel="stylesheet" href="./tailwind.css">
</head>
<body data-book="면접 지도 가이드북">

<div id="doc"></div>
<script type="module">
/* 원고/ 를 순서대로 붙여 조립한다.
   개발 서버(npm run dev)에서는 원고를 고치면 그 자리에서 다시 그려지고,
   빌드(npm run build)하면 원고가 이 페이지 안에 들어가 dist/ 로 나간다. */
import './공통.js';
import { mountViewer } from '../../shared/viewer/viewer.js';

const 원고 = import.meta.glob('./원고/*.html', { query: '?raw', import: 'default', eager: true });

const PARTS = [
  '00_표지차례.html',
  '01_공통.html',
  '02_서류기반.html',
  '03_인적성.html',
  '04_특수.html',
  '05_제시문.html',
  '06_예시.html',
  '07_부록.html'
];

const missing = PARTS.filter((f) => !(('./원고/' + f) in 원고));
const doc = document.getElementById('doc');
if (missing.length) {
  doc.innerHTML =
    '<div class="page"><div class="body"><h3 class="sh">조각을 찾지 못했습니다</h3>' +
    '<p>원고/' + missing.join(', 원고/') + '</p></div></div>';
} else {
  doc.innerHTML = PARTS.map((f) => 원고['./원고/' + f]).join('\n');
  window.paginate();
}
mountViewer({ title: '면접 지도 가이드북', tocFrom: '.toc a[data-to]' });
</script>
</body>
</html>
