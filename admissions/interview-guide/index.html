<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>면접 지도 가이드북</title>

<!-- Tailwind = 면 안에서의 배치·간격.  style.css = 인쇄 규격과 부품.
     HTML 에 style="..." 속성을 쓰지 않는다. 치수는 아래 토큰이나
     임의값 유틸리티(min-h-[32mm], w-[34%])로 적는다. -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      /* sans 와 mono 를 같은 글꼴로 둔다. 고정폭이 끼어들 자리가 없다. */
      fontFamily: {
        sans: ['Pretendard Variable','Pretendard','Noto Sans KR',
               '맑은 고딕','Malgun Gothic','sans-serif'],
        mono: ['Pretendard Variable','Pretendard','Noto Sans KR',
               '맑은 고딕','Malgun Gothic','sans-serif']
      },
      /* 무채색만. style.css 의 :root 변수를 그대로 옮긴 것이다. */
      colors: {
        ink:'#000', bodytx:'#1f1f1f', subtx:'#444', mute:'#6b6b6b', faint:'#949494',
        line:'#cfcfcf', line2:'#8f8f8f', fill:'#f2f2f2', fill2:'#e6e6e6'
      },
      /* 종이 위의 길이는 mm 로만 센다.  p-4mm  gap-5mm  mt-1mm */
      spacing: {
        '1mm':'1mm','1.5mm':'1.5mm','2mm':'2mm','2.5mm':'2.5mm','3mm':'3mm',
        '3.5mm':'3.5mm','4mm':'4mm','4.5mm':'4.5mm','5mm':'5mm','6mm':'6mm',
        '7mm':'7mm','8mm':'8mm','9mm':'9mm','10mm':'10mm','12mm':'12mm',
        '14mm':'14mm','16mm':'16mm','17mm':'17mm','18mm':'18mm','22mm':'22mm'
      },
      /* 글자 크기는 pt 로만 센다.  text-10.5pt */
      fontSize: {
        '8.5pt':'8.5pt','9pt':'9pt','9.5pt':'9.5pt','10pt':'10pt','10.5pt':'10.5pt',
        '11pt':'11pt','11.5pt':'11.5pt','12pt':'12pt','12.5pt':'12.5pt',
        '13pt':'13pt','13.5pt':'13.5pt','14pt':'14pt','15.5pt':'15.5pt',
        '16.5pt':'16.5pt','18pt':'18pt','21pt':'21pt','30pt':'30pt','34pt':'34pt'
      },
      width:  { a4:'210mm' },
      height: { a4:'297mm' },
      borderWidth: {
        hair:'1px', thin:'0.35mm', mid:'0.5mm', bold:'0.6mm',
        heavy:'0.9mm', bar:'1.4mm', bar2:'1.6mm', dbl:'2.2mm'
      }
    }
  }
}
</script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════════════════════════ 인쇄 조작 (화면 전용) -->
<div class="bar no-print">
  <b>인쇄 범위</b>
  <button id="b-all"     aria-pressed="true"  onclick="setScope('all')">전체</button>
  <button id="b-teacher" aria-pressed="false" onclick="setScope('teacher')">본문만</button>
  <button id="b-student" aria-pressed="false" onclick="setScope('student')">학생 배부용 부록만</button>
  <button onclick="window.print()">인쇄</button>
</div>

<!--BUILD:DOC-->
<div id="doc"></div>
<script>
/* parts/ 를 순서대로 불러 조립한다.
   fetch 라서 localhost 로 열어야 한다. file:// 로 열면 조각을 못 읽는다.
   배부본은 `node build.js` 로 만든 단일 파일을 쓴다. */
(function () {
  var PARTS = [
    'parts/00_표지차례.html',
    'parts/01_공통.html',
    'parts/02_서류기반.html',
    'parts/03_인적성.html',
    'parts/04_특수.html',
    'parts/05_제시문.html',
    'parts/06_예시.html',
    'parts/07_부록.html'
  ];
  Promise.all(PARTS.map(function (p) {
    return fetch(p + '?v=' + Date.now()).then(function (r) {
      if (!r.ok) throw new Error(p + ' — ' + r.status);
      return r.text();
    });
  })).then(function (chunks) {
    document.getElementById('doc').innerHTML = chunks.join('\n');
    window.paginate();
  }).catch(function (e) {
    document.getElementById('doc').innerHTML =
      '<div class="page"><div class="body"><h3 class="sh">조각을 불러오지 못했습니다</h3>' +
      '<p>' + e.message + '</p><p>이 파일은 <b>localhost</b> 로 열어야 합니다. ' +
      'file:// 로 열었다면 개발 서버로 다시 여시거나, <kbd>node build.js</kbd> 산출물을 쓰세요.</p></div></div>';
  });
})();
</script>
<!--/BUILD:DOC-->

<script src="app.js"></script>
</body>
</html>
