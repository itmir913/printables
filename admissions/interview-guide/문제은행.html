<script>
/* 문제은행/*.md 를 그때그때 읽어 조판한다. 빌드가 필요 없다.
   .md 를 고치고 새로 고침만 하면 면이 다시 나뉜다.
   fetch 라서 localhost 로 열어야 한다. */
(function () {
  var BOOKS = [
    { file: '문제은행/01_유형별.md', title: '유형별 문항', part: '유형별',
      path: '유형으로 묶은 것' },
    { file: '문제은행/02_전공별.md', title: '전공·계열별 문항', part: '전공별',
      path: '계열로 묶은 것' }
  ];

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function parse(md) {
    var groups = [], cur = null;
    md.split(/\r?\n/).forEach(function (line) {
      if (line.indexOf('## ') === 0) {
        cur = { name: line.slice(3).trim(), items: [] };
        groups.push(cur);
      } else if (line.indexOf('- ') === 0 && cur) {
        cur.items.push(esc(line.slice(2).trim()));
      }
    });
    return groups.filter(function (g) { return g.items.length; });
  }

  /* 표지와 「쓰는 법」 면 — 마크업은 위 <template id="앞면"> 이 원본이다 */
  function cover(total) {
    return document.getElementById('앞면').innerHTML
      .replace('{{문항수}}', total);
  }

  Promise.all(BOOKS.map(function (b) {
    return fetch(b.file + '?v=' + Date.now()).then(function (r) {
      if (!r.ok) throw new Error(b.file + ' — ' + r.status);
      return r.text();
    }).then(function (t) {
      return { title: b.title, part: b.part, path: b.path, groups: parse(t) };
    });
  })).then(function (books) {
    var total = books.reduce(function (n, b) {
      return n + b.groups.reduce(function (m, g) { return m + g.items.length; }, 0);
    }, 0);
    document.getElementById('doc').innerHTML = cover(total);
    document.getElementById('count').textContent = total + '문항';
    buildBank(books);
  }).catch(function (e) {
    document.getElementById('doc').innerHTML =
      '<div class="page"><div class="body"><h3 class="sh">문항을 불러오지 못했습니다</h3>' +
      '<p>' + e.message + '</p><p>이 파일은 <b>localhost</b> 로 열어야 합니다. ' +
      'file:// 로 열면 문항 파일을 읽지 못합니다.</p></div></div>';
  });
})();
</script>
