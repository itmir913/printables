<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>면접 문제 은행</title>

<!-- 스타일은 가이드북과 같은 것을 쓴다. 원본은 저쪽에 하나뿐이다 -->
<link rel="stylesheet" href="../interview-guide/tailwind.css">
</head>
<body data-book="면접 문제 은행">

<div id="doc"></div>

<!-- 표지와 「활용 방법」 면.  이 마크업이 원본이다.
     기준일은 아래 <span> 에 손으로 적는다 — 문항을 손댄 날이지 인쇄한 날이 아니다.
     {{문항수}} 한 자리만 기계가 채운다. -->
<template id="앞면">
<div class="page cover">
  <div class="kicker">면접 지도 가이드북 별책</div>
  <h1>면접 문제 은행</h1>
  <hr>
  <div class="sub">공통 · 전공 · 교과 개념으로 묶은 면접 문항 {{문항수}}개</div>
  <div class="meta">
    <span>2026. 10. 27. 기준</span>
  </div>
  <div class="by">hello@luminousky.com</div>
</div>

<div class="page">
  <div class="head">
    <div class="ttl"><span class="no">활용 방법</span><h2>이 문항을 어떻게 활용하는가</h2></div>
    <span class="path">별책</span>
  </div>
  <div class="body">
    <p class="lead">교육청 자료집·대학 공개 자료·후기 자료집에 공개된 기출 문항을 모아 중복을 제거하고 정리했습니다. 대학·학교·개인을 특정하는 표현은 삭제했습니다.</p>

    <h3 class="sh">암기하지 마십시오</h3>
    <p>여기 있는 문항이 그대로 나오지 않습니다. 면접 기출문항의 용도는 <b>유형을 익히는 데</b> 있습니다. 학생이 자기 학생부로 <b>같은 유형의 문항을 스스로 만들게</b> 하는 것이 목적입니다.</p>

    <h3 class="sh">이렇게 활용합니다</h3>
    <ol class="steps">
      <li><b>학생이 면접 예상 답변을 준비할때 사용합니다.</b> 자신의 계열에 해당하는 유형을 나열해 놓고, 답변할 수 있는 것과 막히는 것을 표시하게 합니다.</li>
      <li><b>답변이 막히는 것부터</b> 준비시킵니다. 자신있게 답변할 수 있는 것은 이미 준비된 것입니다.</li>
      <li><b>모의면접 문항지</b>를 여기서 뽑습니다. 공통 유형에서 셋, 계열에서 둘, 교과 개념에서 하나, 학생부에서 셋.</li>
      <li>선택한 문항마다 <b>꼬리질문</b>을 하나씩 던져 봅니다. 꼬리질문까지가 면접 준비입니다.</li>
    </ol>

    <h3 class="sh">유형마다 기출 문항 수가 다릅니다</h3>
    <p><b>실제 기출의 분포를 그대로 추출</b>하였습니다. 예를 들어, 자기소개와 마지막으로 하고 싶은 말은 문제 은행으로 모아 보면 다른 유형의 절반도 되지 않습니다. 그만큼 <b>덜 묻는다</b>는 뜻입니다. 반대로 세특·탐구와 시사·윤리 쟁점은 서로 다른 질문이 계속 나옵니다.</p>
    <p>없는 문항을 지어내 채우지 않았습니다. 여기 있는 것은 전부 실제로 나온 질문을 정제한 것입니다.</p>

    <div class="note warn"><span class="t">매년 바뀝니다</span><p>대학의 면접 문항은 매년 달라집니다. 같은 대학 동일 학과라도 학생마다 질문이 다릅니다. 이 면접 문제 은행은 <b>지난 기출을 모은 것</b>이지 올해 나올 예시 문항이 아닙니다. 지원 대학이 공개한 <b>선행학습 영향평가 결과보고서</b>를 반드시 함께 보십시오.</p></div>

    <div class="note tip"><span class="t">개인별 대입전형자료에 제공되지 않는 항목은 질문하지 않습니다</span><p>예를 들어, 수상경력·개인 봉사활동 실적·자율동아리·독서활동상황은 <b>대입에 제공되지 않습니다.</b> 여기 실린 독서·수상 유형의 문항은 <b>세특과 창체 특기사항에 서술된</b> 책과 대회 준비 과정에서 면접 문항이 출제되었다고 생각하고 문제 은행을 살펴보십시오.</p></div>
  </div>
  <div class="foot"><span class="bk"></span><span class="pg"></span></div>
</div>
</template>

<script type="module">
/* 문제은행/*.md 를 읽어 조판한다. .md 를 고치면 개발 서버에서 면이 다시 나뉘고,
   빌드하면 문항이 이 페이지 안에 들어가 dist/ 로 나간다. */
import './문제은행조판.js';
import '../interview-guide/공통.js';
import { mountViewer } from '../../shared/viewer/viewer.js';
import 유형별 from './문제은행/01_유형별.md?raw';
import 전공별 from './문제은행/02_전공별.md?raw';
import 교과개념 from './문제은행/03_교과개념.md?raw';

(function () {
  var BOOKS = [
    { md: 유형별, title: '공통 문항', part: '공통', path: '공통 유형' },
    { md: 전공별, title: '전공·계열별 문항', part: '전공', path: '전공·계열별' },
    { md: 교과개념, title: '교과 개념 문항', part: '교과', path: '교과별 개념' }
  ];

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function parse(md) {
    var groups = [], cur = null;
    md.split(/\r?\n/).forEach(function (line) {
      if (line.indexOf('## ') === 0) {
        cur = { name: line.slice(3).trim(), items: [] };
        groups.push(cur);
      } else if (line.indexOf('- ') === 0 && cur) {
        cur.items.push(esc(line.slice(2).trim()));
      }
    });
    return groups.filter(function (g) { return g.items.length; });
  }

  /* 표지와 「활용 방법」 면 — 마크업은 위 <template id="앞면"> 이 원본이다 */
  function cover(total) {
    return document.getElementById('앞면').innerHTML
      .replace('{{문항수}}', total);
  }

  var books = BOOKS.map(function (b) {
    return { title: b.title, part: b.part, path: b.path, groups: parse(b.md) };
  });
  var total = books.reduce(function (n, b) {
    return n + b.groups.reduce(function (m, g) { return m + g.items.length; }, 0);
  }, 0);
  document.getElementById('doc').innerHTML = cover(total);
  buildBank(books);
})();
mountViewer({ title: '면접 문제 은행' });
</script>
</body>
</html>
