<html lang="ko" class="scroll-smooth bg-[#fcfcfa] [scrollbar-color:#c7c5bd_#f4f2ef] [&::-webkit-scrollbar]:w-3 [&::-webkit-scrollbar-track]:bg-[#f4f2ef] [&::-webkit-scrollbar-thumb]:rounded-sm [&::-webkit-scrollbar-thumb]:border-2 [&::-webkit-scrollbar-thumb]:border-solid [&::-webkit-scrollbar-thumb]:border-[#f4f2ef] [&::-webkit-scrollbar-thumb]:bg-[#c7c5bd] motion-reduce:scroll-auto dark:bg-[#0b0b0c] dark:[scrollbar-color:#3d3d40_#0b0b0c] dark:[&::-webkit-scrollbar-track]:bg-[#0b0b0c] dark:[&::-webkit-scrollbar-thumb]:border-[#0b0b0c] dark:[&::-webkit-scrollbar-thumb]:bg-[#3d3d40]">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var root = document.documentElement;
            var theme = null;
            try {
                theme = localStorage.getItem('theme');
            } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            root.dataset.theme = theme;
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="교실에서 바로 인쇄해 쓰는 진학 지도 자료입니다. 수시 면접 지도 가이드북과 면접 문제 은행을 제공합니다.">
    <meta name="theme-color" content="#fcfcfa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <title>진학 지도 자료 | Printables</title>

    <link rel="stylesheet" href="../shared/landing.css">
    <script type="module" src="../shared/landing.js"></script>
</head>
<!-- 진학 분야의 바로가기 쪽. 내용은 shared/catalog.js 의 admissions 항목이 정하고,
     그리는 일은 shared/landing.js 가 한다. 새 분야는 이 파일을 복사해 data-category · title · description 만 바꾼다. -->

<div id="app"></div>
</body>
</html>
