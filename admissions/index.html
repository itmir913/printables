<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var root = document.documentElement;
            var theme = null;
            try {
                theme = localStorage.getItem('theme');
            } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            root.dataset.theme = theme;
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="교실에서 바로 인쇄해 쓰는 진학 지도 자료입니다. 수시 면접 지도 가이드북과 면접 문제 은행을 제공합니다.">
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <title>진학 지도 자료 | Printables</title>
    <link rel="icon" href="https://luminousky.com/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="https://luminousky.com/apple-touch-icon.png">

    <link rel="stylesheet" href="../shared/landing.css">
    <script type="module" src="../shared/landing.js"></script>
</head>
